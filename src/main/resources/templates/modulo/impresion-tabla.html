<!DOCTYPE html><html lang="es" xmlns:th="http://www.thymeleaf.org"><body>
<div th:fragment="tabla(lista,montados)" th:with="ins=${documento.tipo.name() == 'INSPECCION'},cam=${documento.tipo.name() == 'CAMBIO'},req=${documento.tipo.name() == 'REQUERIMIENTO'}">
<table class="paper-table"><thead><tr><th th:text="${req ? 'Ítem' : 'Pos.'}"></th><th>Código</th><th>Marca</th><th>Diseño</th><th>Medida</th><th th:unless="${cam}">R/N</th><th th:unless="${req}">R1 / R3</th><th th:unless="${req}">R2 / R4</th><th th:unless="${req}">Prom. mm</th><th th:if="${ins}">PSI</th><th th:if="${ins}">Aro</th><th th:if="${ins}">Estado</th><th th:if="${ins}">Sin tapa</th><th th:if="${cam and !montados}">Disposición</th><th th:if="${req}">Cantidad</th><th th:if="${req}">Conformidad</th></tr></thead><tbody>
<tr th:each="r,it : ${lista}" th:if="${ins or r.usada}"><td th:text="${req ? it.count : r.posicion}"></td><td th:text="${montados ? r.codigoNuevo : r.codigo}"></td><td th:text="${montados ? r.marcaNueva : r.marca}"></td><td th:text="${montados ? r.disenoNuevo : r.diseno}"></td><td th:text="${montados ? r.medidaNueva : r.medida}"></td><td th:unless="${cam}" th:text="${r.rn}"></td><td th:unless="${req}" th:text="${montados ? r.n1 : r.r1}"></td><td th:unless="${req}" th:text="${montados ? r.n2 : r.r2}"></td><td th:unless="${req}" th:text="${montados ? r.promedioNuevo : r.promedio}"></td><td th:if="${ins}" th:text="${r.presion}"></td><td th:if="${ins}" th:text="${r.aro}"></td><td th:if="${ins}" th:text="${r.condicion}"></td><td th:if="${ins}" th:text="${r.sinTapa}"></td><td th:if="${cam and !montados}" th:text="${r.disposicion}"></td><td th:if="${req}" th:text="${r.cantidad}"></td><td th:if="${req}" th:text="${r.conformidad}"></td></tr></tbody></table></div></body></html>
