<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Registrar unidad</title>
    <link rel="stylesheet" th:href="@{/css/estilos.css}">
</head>
<body>
    <main class="contenedor">
        <span class="empresa">TRANSMDICAS</span>

        <h1>Registrar unidad</h1>
        <p>Completa los datos de la unidad.</p>

        <section class="tarjeta">
            <form
                th:action="@{/unidades}"
                th:object="${unidadForm}"
                method="post"
            >
                <div th:if="${#fields.hasGlobalErrors()}">
                    <p
                        class="error"
                        th:each="error : ${#fields.globalErrors()}"
                        th:text="${error}"
                    ></p>
                </div>

                <div class="campo">
                    <label for="placa">Placa</label>
                    <input
                        type="text"
                        th:field="*{placa}"
                        maxlength="10"
                        required
                    >
                    <small class="error" th:errors="*{placa}"></small>
                </div>

                <div class="campo">
                    <label for="marca">Marca</label>
                    <input
                        type="text"
                        th:field="*{marca}"
                        maxlength="100"
                        required
                    >
                    <small class="error" th:errors="*{marca}"></small>
                </div>

                <div class="campo">
                    <label for="operacion">Operación</label>
                    <input
                        type="text"
                        th:field="*{operacion}"
                        maxlength="150"
                        required
                    >
                    <small class="error" th:errors="*{operacion}"></small>
                </div>

                <div class="campo">
                    <label for="ruta">Ruta</label>
                    <input
                        type="text"
                        th:field="*{ruta}"
                        maxlength="200"
                        required
                    >
                    <small class="error" th:errors="*{ruta}"></small>
                </div>

                <button type="submit">Guardar unidad</button>
                <a th:href="@{/unidades}">Cancelar</a>
            </form>
        </section>
    </main>
</body>
</html>
